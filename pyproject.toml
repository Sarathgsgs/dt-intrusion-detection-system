[project]
name = "twin-ids-project"
version = "1.0.0"
description = "Twin-Guided Explainable Intrusion Detection System for Industrial IoT"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.100.0",
    "uvicorn>=0.23.0",
    "pydantic>=2.0.0",
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "scikit-learn>=1.3.0",
    "xgboost>=2.0.0",
    "shap>=0.44.0",
    "joblib>=1.3.0",
    "matplotlib>=3.7.0"
]

[tool.vercel]
entrypoint = "src.api_server:app"
